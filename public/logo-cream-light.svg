  <text x="256" y="420" font-family="'Cinzel', 'Playfair Display', serif, system-ui" font-size="20" font-weight="700" letter-spacing="10" fill="#1C1714" text-anchor="middle">AMALIA BROWS</text>
  <text x="256" y="445" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="8" fill="#886C56" text-anchor="middle">ACADEMY</text>
