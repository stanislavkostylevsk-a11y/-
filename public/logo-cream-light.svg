      <stop offset="50%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#EFE6DA"/>
    </radialGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A373"/>
      <stop offset="50%" stop-color="#B37D4E"/>
      <stop offset="100%" stop-color="#6F4627"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGradGold)"/>
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="url(#goldGrad2)" stroke-width="2.5" stroke-opacity="0.4"/>

