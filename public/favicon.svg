<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep rich dark background -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#241B15"/>
      <stop offset="60%" stop-color="#140E0A"/>
      <stop offset="100%" stop-color="#0A0705"/>
    </radialGradient>

    <!-- Warm rose-gold champagne gradient for brow and accents -->
    <linearGradient id="goldBrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF1DF"/>
      <stop offset="25%" stop-color="#E5BE95"/>
      <stop offset="65%" stop-color="#C79668"/>
      <stop offset="100%" stop-color="#8F5F3B"/>
    </linearGradient>

    <radialGradient id="glowEffect" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#D9A87A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D9A87A" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle luxury glow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="512" height="512" rx="136" fill="url(#bgGrad)"/>
  
  <!-- Ambient warm halo -->
  <circle cx="256" cy="200" r="180" fill="url(#glowEffect)"/>

  <!-- Outer dual hairline borders with rounded squircle corners -->
  <rect x="34" y="34" width="444" height="444" rx="104" fill="none" stroke="url(#goldBrowGrad)" stroke-width="2.5" stroke-opacity="0.4"/>
  <rect x="46" y="46" width="420" height="420" rx="92" fill="none" stroke="#FAF7F2" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Smooth Brow Arch Curve (passing behind/interlaced with 'A') -->
  <path
    d="M116 226 C 170 148, 335 142, 412 226"
    fill="none"
    stroke="url(#goldBrowGrad)"
    stroke-width="26"
    stroke-linecap="round"
    filter="url(#softGlow)"
  />

  <!-- Delicate feathered tail highlight -->
  <path
    d="M336 172 C 366 182, 388 200, 412 226"
    fill="none"
    stroke="#FFF3E0"
    stroke-width="14"
    stroke-linecap="round"
    stroke-opacity="0.85"
  />

  <!-- Letter 'A' bold white architectural legs -->
  <line x1="256" y1="120" x2="162" y2="384" stroke="#FAF7F2" stroke-width="28" stroke-linecap="round"/>
  <line x1="256" y1="120" x2="350" y2="384" stroke="#FAF7F2" stroke-width="28" stroke-linecap="round"/>

  <!-- Apex sphere / sparkling beauty dot -->
  <circle cx="256" cy="116" r="22" fill="url(#goldBrowGrad)" filter="url(#softGlow)"/>
  <circle cx="253" cy="112" r="8" fill="#FFFBF5" opacity="0.8"/>

  <!-- Typography: AMALIA BROWS -->
  <text
    x="256"
    y="426"
    font-family="'Playfair Display', Georgia, serif"
    font-size="22"
    font-weight="700"
    letter-spacing="12"
    fill="#FAF7F2"
    text-anchor="middle"
  >AMALIA BROWS</text>

  <!-- Typography: ACADEMY -->
  <text
    x="256"
    y="450"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="12"
    font-weight="600"
    letter-spacing="8"
    fill="#C79668"
    text-anchor="middle"
  >ACADEMY</text>
</svg>
