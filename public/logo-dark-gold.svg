<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2C231C"/>
      <stop offset="60%" stop-color="#18130E"/>
      <stop offset="100%" stop-color="#0E0A08"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD8"/>
      <stop offset="35%" stop-color="#E5C09B"/>
      <stop offset="70%" stop-color="#C99A6E"/>
      <stop offset="100%" stop-color="#8A5A36"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer luxury golden border -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.35"/>
  <rect x="48" y="48" width="416" height="416" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Eyebrow graceful curve -->
  <path d="M120 220 C180 145, 330 140, 400 190" fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" filter="url(#goldGlow)"/>
  
  <!-- Feathered brow tip detail -->
  <path d="M335 170 C365 180, 385 195, 410 225" fill="none" stroke="url(#goldGrad)" stroke-width="11" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Haute-couture Letter 'A' stems -->
  <path d="M256 128 L168 376 M256 128 L344 376" fill="none" stroke="#FAF7F2" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gold luxury extended crossbar -->
  <path d="M142 300 H370" fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" filter="url(#goldGlow)"/>

  <!-- Diamond / starlet peak accent -->
  <circle cx="256" cy="112" r="18" fill="url(#goldGrad)" filter="url(#goldGlow)"/>

  <!-- Text inscription below -->
  <text x="256" y="420" font-family="'Cinzel', 'Playfair Display', serif, system-ui" font-size="20" font-weight="700" letter-spacing="10" fill="#FAF7F2" text-anchor="middle" opacity="0.95">AMALIA BROWS</text>
  <text x="256" y="445" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="8" fill="#C99A6E" text-anchor="middle">ACADEMY</text>
</svg>
